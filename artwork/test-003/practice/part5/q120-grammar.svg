<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1024" y="0" width="512" height="1024" fill="#faf8f2"/><text x="1052" y="38" fill="#183f3b" font-size="19"><tspan x="1052" dy="0">QUESTION 120 · GRAMMAR &amp; MEANING </tspan></text><text x="1052" y="89" fill="#183f3b" font-size="29"><tspan x="1052" dy="0">Infinitive + object </tspan></text><text x="1052" y="175" fill="#183f3b" font-size="26"><tspan x="1052" dy="0">to + vend + apparel </tspan></text><rect x="1052" y="275" width="456" height="88" rx="14" fill="#dcebe5"/><text x="1070" y="310" fill="#183f3b" font-size="24"><tspan x="1070" dy="0">Retailer </tspan></text><path d="M1280 366v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1052" y="391" width="456" height="88" rx="14" fill="#dcebe5"/><text x="1070" y="426" fill="#183f3b" font-size="24"><tspan x="1070" dy="0">Sells branded apparel </tspan></text><path d="M1280 482v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1052" y="507" width="456" height="88" rx="14" fill="#dcebe5"/><text x="1070" y="542" fill="#183f3b" font-size="24"><tspan x="1070" dy="0">Approved locations only </tspan></text><text x="1052" y="665" fill="#183f3b" font-size="23"><tspan x="1052" dy="0">Why the other forms do not fit </tspan></text><text x="1052" y="712" fill="#183f3b" font-size="21"><tspan x="1052" dy="0">Vend means sell and takes merchandise as </tspan><tspan x="1052" dy="27.3">its object. The other verbs concern </tspan><tspan x="1052" dy="27.3">attraction, surrender, or staring and do </tspan><tspan x="1052" dy="27.3">not express retail sales. </tspan></text></g></svg>