<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="570" width="1536" height="454" fill="#faf8f2"/><text x="28" y="608" fill="#183f3b" font-size="22"><tspan x="28" dy="0">QUESTION 109 · GRAMMAR &amp; MEANING </tspan></text><text x="28" y="659" fill="#183f3b" font-size="29"><tspan x="28" dy="0">Adjective modifies noun </tspan></text><text x="28" y="702" fill="#183f3b" font-size="30"><tspan x="28" dy="0">covert → activity </tspan></text><rect x="28" y="730" width="472" height="88" rx="14" fill="#dcebe5"/><text x="43" y="764" fill="#183f3b" font-size="25"><tspan x="43" dy="0">Adjective: covert </tspan></text><path d="M503 774h23" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="530" y="730" width="472" height="88" rx="14" fill="#dcebe5"/><text x="545" y="764" fill="#183f3b" font-size="25"><tspan x="545" dy="0">Noun: activity </tspan></text><path d="M1005 774h23" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1032" y="730" width="472" height="88" rx="14" fill="#dcebe5"/><text x="1047" y="764" fill="#183f3b" font-size="25"><tspan x="1047" dy="0">Finding: no evidence </tspan></text><text x="28" y="865" fill="#183f3b" font-size="23"><tspan x="28" dy="0">An adjective modifies activity. Covert means hidden; covertly is an adverb, covertness a noun, and cover is not the </tspan><tspan x="28" dy="29.900000000000002">intended adjective. </tspan></text></g></svg>