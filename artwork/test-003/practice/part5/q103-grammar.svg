<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1016" y="0" width="520" height="1024" fill="#faf8f2"/><text x="1044" y="38" fill="#183f3b" font-size="19"><tspan x="1044" dy="0">QUESTION 103 · GRAMMAR &amp; MEANING </tspan></text><text x="1044" y="89" fill="#183f3b" font-size="29"><tspan x="1044" dy="0">Modal + base verb </tspan></text><text x="1044" y="175" fill="#183f3b" font-size="26"><tspan x="1044" dy="0">must not + obscure </tspan></text><rect x="1044" y="275" width="464" height="88" rx="14" fill="#dcebe5"/><text x="1062" y="310" fill="#183f3b" font-size="24"><tspan x="1062" dy="0">Door ornament </tspan></text><path d="M1276 366v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1044" y="391" width="464" height="88" rx="14" fill="#dcebe5"/><text x="1062" y="426" fill="#183f3b" font-size="24"><tspan x="1062" dy="0">May obscure the sign </tspan></text><path d="M1276 482v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1044" y="507" width="464" height="88" rx="14" fill="#dcebe5"/><text x="1062" y="542" fill="#183f3b" font-size="24"><tspan x="1062" dy="0">Keep the sign visible </tspan></text><text x="1044" y="665" fill="#183f3b" font-size="23"><tspan x="1044" dy="0">Why the other forms do not fit </tspan></text><text x="1044" y="712" fill="#183f3b" font-size="21"><tspan x="1044" dy="0">Obscure means make difficult to see and </tspan><tspan x="1044" dy="27.3">takes the sign as its object. The other </tspan><tspan x="1044" dy="27.3">verbs do not describe covering a sign. </tspan></text></g></svg>