<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="916" y="0" width="620" height="1024" fill="#faf8f2"/><text x="944" y="38" fill="#183f3b" font-size="19"><tspan x="944" dy="0">QUESTION 118 · GRAMMAR &amp; MEANING </tspan></text><text x="944" y="89" fill="#183f3b" font-size="29"><tspan x="944" dy="0">Adjective modifies noun </tspan></text><text x="944" y="175" fill="#183f3b" font-size="26"><tspan x="944" dy="0">plausible → explanation </tspan></text><rect x="944" y="275" width="564" height="88" rx="14" fill="#dcebe5"/><text x="962" y="310" fill="#183f3b" font-size="24"><tspan x="962" dy="0">Explanation is a noun </tspan></text><path d="M1226 366v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="944" y="391" width="564" height="88" rx="14" fill="#dcebe5"/><text x="962" y="426" fill="#183f3b" font-size="24"><tspan x="962" dy="0">Plausible is an adjective </tspan></text><path d="M1226 482v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="944" y="507" width="564" height="88" rx="14" fill="#dcebe5"/><text x="962" y="542" fill="#183f3b" font-size="24"><tspan x="962" dy="0">Believable explanation </tspan></text><text x="944" y="665" fill="#183f3b" font-size="23"><tspan x="944" dy="0">Why the other forms do not fit </tspan></text><text x="944" y="712" fill="#183f3b" font-size="21"><tspan x="944" dy="0">The noun explanation requires an adjective. </tspan><tspan x="944" dy="27.3">Plausible means believable; the other forms are </tspan><tspan x="944" dy="27.3">adverbial or nominal. </tspan></text></g></svg>