<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1000" y="0" width="536" height="1024" fill="#faf8f2"/><text x="1028" y="38" fill="#183f3b" font-size="19"><tspan x="1028" dy="0">QUESTION 126 · GRAMMAR &amp; MEANING </tspan></text><text x="1028" y="89" fill="#183f3b" font-size="29"><tspan x="1028" dy="0">Verb + preposition </tspan></text><text x="1028" y="175" fill="#183f3b" font-size="26"><tspan x="1028" dy="0">culminate in + final event </tspan></text><rect x="1028" y="275" width="480" height="88" rx="14" fill="#dcebe5"/><text x="1046" y="310" fill="#183f3b" font-size="24"><tspan x="1046" dy="0">Campaign progress </tspan></text><path d="M1268 366v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1028" y="391" width="480" height="88" rx="14" fill="#dcebe5"/><text x="1046" y="426" fill="#183f3b" font-size="24"><tspan x="1046" dy="0">Final stage </tspan></text><path d="M1268 482v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1028" y="507" width="480" height="88" rx="14" fill="#dcebe5"/><text x="1046" y="542" fill="#183f3b" font-size="24"><tspan x="1046" dy="0">Awards ceremony: planned </tspan></text><text x="1028" y="665" fill="#183f3b" font-size="23"><tspan x="1028" dy="0">Why the other forms do not fit </tspan></text><text x="1028" y="712" fill="#183f3b" font-size="21"><tspan x="1028" dy="0">Culminate in means reach a final stage. The </tspan><tspan x="1028" dy="27.3">other verbs do not naturally use in to </tspan><tspan x="1028" dy="27.3">describe an event's conclusion. </tspan></text></g></svg>