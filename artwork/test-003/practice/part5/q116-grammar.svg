<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="520" width="1536" height="504" fill="#faf8f2"/><text x="28" y="558" fill="#183f3b" font-size="22"><tspan x="28" dy="0">QUESTION 116 · GRAMMAR &amp; MEANING </tspan></text><text x="28" y="609" fill="#183f3b" font-size="29"><tspan x="28" dy="0">Modal + base verb </tspan></text><text x="28" y="652" fill="#183f3b" font-size="30"><tspan x="28" dy="0">may + forfeit + discount </tspan></text><rect x="28" y="680" width="472" height="88" rx="14" fill="#dcebe5"/><text x="43" y="714" fill="#183f3b" font-size="25"><tspan x="43" dy="0">Condition: late payment </tspan></text><path d="M503 724h23" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="530" y="680" width="472" height="88" rx="14" fill="#dcebe5"/><text x="545" y="714" fill="#183f3b" font-size="25"><tspan x="545" dy="0">Possible loss </tspan></text><path d="M1005 724h23" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="1032" y="680" width="472" height="88" rx="14" fill="#dcebe5"/><text x="1047" y="714" fill="#183f3b" font-size="25"><tspan x="1047" dy="0">Not a certain result </tspan></text><text x="28" y="815" fill="#183f3b" font-size="23"><tspan x="28" dy="0">Forfeit means lose an entitlement. The other verbs cannot naturally take discount with this meaning. </tspan></text></g></svg>