<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><g font-family="Arial, sans-serif"><rect x="960" y="0" width="576" height="1024" fill="#faf8f2"/><text x="988" y="38" fill="#183f3b" font-size="19"><tspan x="988" dy="0">QUESTION 105 · GRAMMAR &amp; MEANING </tspan></text><text x="988" y="89" fill="#183f3b" font-size="29"><tspan x="988" dy="0">Verb + content clause </tspan></text><text x="988" y="175" fill="#183f3b" font-size="26"><tspan x="988" dy="0">insinuate + that-clause </tspan></text><rect x="988" y="275" width="520" height="88" rx="14" fill="#dcebe5"/><text x="1006" y="310" fill="#183f3b" font-size="24"><tspan x="1006" dy="0">Indirect suggestion </tspan></text><path d="M1248 366v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="988" y="391" width="520" height="88" rx="14" fill="#dcebe5"/><text x="1006" y="426" fill="#183f3b" font-size="24"><tspan x="1006" dy="0">that introduces content </tspan></text><path d="M1248 482v20" stroke="#ca7858" stroke-width="4" marker-end="url(#arrow)"/><rect x="988" y="507" width="520" height="88" rx="14" fill="#dcebe5"/><text x="1006" y="542" fill="#183f3b" font-size="24"><tspan x="1006" dy="0">No endorsement established </tspan></text><text x="988" y="665" fill="#183f3b" font-size="23"><tspan x="988" dy="0">Why the other forms do not fit </tspan></text><text x="988" y="712" fill="#183f3b" font-size="21"><tspan x="988" dy="0">Insinuate can take a that-clause meaning </tspan><tspan x="988" dy="27.3">suggest indirectly. Exterminate and tarnish </tspan><tspan x="988" dy="27.3">require suitable objects, while sewage is a </tspan><tspan x="988" dy="27.3">noun. </tspan></text></g></svg>