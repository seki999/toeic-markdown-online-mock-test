<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img"><title>Distinguish two motives</title><desc>The award recognizes altruism rather than personal financial gain. Rather than contrasts motives. The other choices introduce timing, concession, or purpose clauses and do not connect the noun phrases correctly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><rect width="1536" height="1024" fill="#faf8f2"/><g font-family="Arial, sans-serif"><text x="60" y="65" font-size="22" fill="#183f3b"><tspan x="60" dy="0">PART 5 · QUESTION 130 </tspan></text><text x="60" y="125" font-size="42" fill="#183f3b"><tspan x="60" dy="0">Distinguish two motives </tspan></text><text x="60" y="190" font-size="28" fill="#384e52"><tspan x="60" dy="0">The award recognizes altruism rather than personal financial gain. </tspan></text><rect x="55" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M80 5v130M35 140h90M15 40h130M35 40l-25 60h50zM125 40l-25 60h50z"/></g><text x="80" y="515" font-size="27" fill="#183f3b"><tspan x="80" dy="0">Help others </tspan></text><path d="M485 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="555" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(685 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M80 5v130M35 140h90M15 40h130M35 40l-25 60h50zM125 40l-25 60h50z"/></g><text x="580" y="515" font-size="27" fill="#183f3b"><tspan x="580" dy="0">Award recognizes </tspan><tspan x="580" dy="36.45">altruism </tspan></text><path d="M985 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="1055" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(1185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M80 5v130M35 140h90M15 40h130M35 40l-25 60h50zM125 40l-25 60h50z"/></g><text x="1080" y="515" font-size="27" fill="#183f3b"><tspan x="1080" dy="0">Rather than personal </tspan><tspan x="1080" dy="36.45">gain </tspan></text><rect x="55" y="635" width="1425" height="325" rx="24" fill="#183f3b"/><text x="85" y="685" font-size="29" fill="#ffffff"><tspan x="85" dy="0">Contrast noun phrases </tspan></text><text x="85" y="735" font-size="34" fill="#f5c998"><tspan x="85" dy="0">altruism rather than gain </tspan></text><text x="85" y="795" font-size="25" fill="#ffffff"><tspan x="85" dy="0">Rather than contrasts motives. The other choices introduce timing, concession, or purpose clauses </tspan><tspan x="85" dy="33.75">and do not connect the noun phrases correctly. </tspan></text></g></svg>