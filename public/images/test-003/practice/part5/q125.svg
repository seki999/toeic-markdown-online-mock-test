<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img"><title>A completed replacement</title><desc>The maintenance team has replaced the faulty sensor. Has requires a past participle in the present perfect; replaced is correct. The noun, ing form, and base form do not fit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><rect width="1536" height="1024" fill="#faf8f2"/><g font-family="Arial, sans-serif"><text x="60" y="65" font-size="22" fill="#183f3b"><tspan x="60" dy="0">PART 5 · QUESTION 125 </tspan></text><text x="60" y="125" font-size="42" fill="#183f3b"><tspan x="60" dy="0">A completed replacement </tspan></text><text x="60" y="190" font-size="28" fill="#384e52"><tspan x="60" dy="0">The maintenance team has replaced the faulty sensor. </tspan></text><rect x="55" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="35" width="150" height="100" rx="12"/><path d="M30 35V0h100v35M35 75h60m-60 25h60"/><circle cx="128" cy="65" r="7"/></g><text x="80" y="515" font-size="27" fill="#183f3b"><tspan x="80" dy="0">Faulty sensor: before </tspan></text><path d="M485 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="555" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(685 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="35" width="150" height="100" rx="12"/><path d="M30 35V0h100v35M35 75h60m-60 25h60"/><circle cx="128" cy="65" r="7"/></g><text x="580" y="515" font-size="27" fill="#183f3b"><tspan x="580" dy="0">Team replaces sensor </tspan></text><path d="M985 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="1055" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(1185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="35" width="150" height="100" rx="12"/><path d="M30 35V0h100v35M35 75h60m-60 25h60"/><circle cx="128" cy="65" r="7"/></g><text x="1080" y="515" font-size="27" fill="#183f3b"><tspan x="1080" dy="0">Working sensor: now </tspan></text><rect x="55" y="635" width="1425" height="325" rx="24" fill="#183f3b"/><text x="85" y="685" font-size="29" fill="#ffffff"><tspan x="85" dy="0">Present perfect </tspan></text><text x="85" y="735" font-size="34" fill="#f5c998"><tspan x="85" dy="0">has + replaced </tspan></text><text x="85" y="795" font-size="25" fill="#ffffff"><tspan x="85" dy="0">Has requires a past participle in the present perfect; replaced is correct. The noun, ing form, and </tspan><tspan x="85" dy="33.75">base form do not fit. </tspan></text></g></svg>