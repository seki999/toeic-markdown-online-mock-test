<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img"><title>Set aside a room</title><desc>Staff should reserve the small conference room for interviews. Should takes a base verb, reserve. The other grammatical forms do not fit after the modal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><rect width="1536" height="1024" fill="#faf8f2"/><g font-family="Arial, sans-serif"><text x="60" y="65" font-size="22" fill="#183f3b"><tspan x="60" dy="0">PART 5 · QUESTION 128 </tspan></text><text x="60" y="125" font-size="42" fill="#183f3b"><tspan x="60" dy="0">Set aside a room </tspan></text><text x="60" y="190" font-size="28" fill="#384e52"><tspan x="60" dy="0">Staff should reserve the small conference room for interviews. </tspan></text><rect x="55" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="20" width="140" height="120" rx="8"/><path d="M10 55h140M45 5v30M115 5v30M40 85h20m30 0h20m-70 25h20"/></g><text x="80" y="515" font-size="27" fill="#183f3b"><tspan x="80" dy="0">Staff make booking </tspan></text><path d="M485 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="555" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(685 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="20" width="140" height="120" rx="8"/><path d="M10 55h140M45 5v30M115 5v30M40 85h20m30 0h20m-70 25h20"/></g><text x="580" y="515" font-size="27" fill="#183f3b"><tspan x="580" dy="0">Conference room </tspan><tspan x="580" dy="36.45">reserved </tspan></text><path d="M985 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="1055" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(1185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="20" width="140" height="120" rx="8"/><path d="M10 55h140M45 5v30M115 5v30M40 85h20m30 0h20m-70 25h20"/></g><text x="1080" y="515" font-size="27" fill="#183f3b"><tspan x="1080" dy="0">Interviews take place </tspan></text><rect x="55" y="635" width="1425" height="325" rx="24" fill="#183f3b"/><text x="85" y="685" font-size="29" fill="#ffffff"><tspan x="85" dy="0">Modal + base verb </tspan></text><text x="85" y="735" font-size="34" fill="#f5c998"><tspan x="85" dy="0">should + reserve </tspan></text><text x="85" y="795" font-size="25" fill="#ffffff"><tspan x="85" dy="0">Should takes a base verb, reserve. The other grammatical forms do not fit after the modal. </tspan></text></g></svg>