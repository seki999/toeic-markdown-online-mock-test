<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img"><title>Training revision has a purpose</title><desc>The training materials were revised so that employees could understand the terminology. So that introduces a purpose clause. The other expressions do not introduce the stated finite clause appropriately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><rect width="1536" height="1024" fill="#faf8f2"/><g font-family="Arial, sans-serif"><text x="60" y="65" font-size="22" fill="#183f3b"><tspan x="60" dy="0">PART 5 · QUESTION 121 </tspan></text><text x="60" y="125" font-size="42" fill="#183f3b"><tspan x="60" dy="0">Training revision has a purpose </tspan></text><text x="60" y="190" font-size="28" fill="#384e52"><tspan x="60" dy="0">The training materials were revised so that employees could understand the terminology. </tspan></text><rect x="55" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10q35-15 70 5 35-20 70-5v100q-35-15-70 5-35-20-70-5zM75 15v100M23 40h30m-30 24h30m45-24h30m-30 24h30"/></g><text x="80" y="515" font-size="27" fill="#183f3b"><tspan x="80" dy="0">Revise materials </tspan></text><path d="M485 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="555" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(685 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10q35-15 70 5 35-20 70-5v100q-35-15-70 5-35-20-70-5zM75 15v100M23 40h30m-30 24h30m45-24h30m-30 24h30"/></g><text x="580" y="515" font-size="27" fill="#183f3b"><tspan x="580" dy="0">PURPOSE → </tspan></text><path d="M985 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="1055" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(1185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10q35-15 70 5 35-20 70-5v100q-35-15-70 5-35-20-70-5zM75 15v100M23 40h30m-30 24h30m45-24h30m-30 24h30"/></g><text x="1080" y="515" font-size="27" fill="#183f3b"><tspan x="1080" dy="0">Employees understand </tspan><tspan x="1080" dy="36.45">terms </tspan></text><rect x="55" y="635" width="1425" height="325" rx="24" fill="#183f3b"/><text x="85" y="685" font-size="29" fill="#ffffff"><tspan x="85" dy="0">Purpose clause </tspan></text><text x="85" y="735" font-size="34" fill="#f5c998"><tspan x="85" dy="0">so that + subject + verb </tspan></text><text x="85" y="795" font-size="25" fill="#ffffff"><tspan x="85" dy="0">So that introduces a purpose clause. The other expressions do not introduce the stated finite clause </tspan><tspan x="85" dy="33.75">appropriately. </tspan></text></g></svg>