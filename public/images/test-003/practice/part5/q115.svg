<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img"><title>Cause of business popularity</title><desc>The firm's popularity is due to its reliable after-sales service. Due to is the fixed phrase for cause. The other prepositions do not complete it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ca7858"/></marker></defs><rect width="1536" height="1024" fill="#faf8f2"/><g font-family="Arial, sans-serif"><text x="60" y="65" font-size="22" fill="#183f3b"><tspan x="60" dy="0">PART 5 · QUESTION 115 </tspan></text><text x="60" y="125" font-size="42" fill="#183f3b"><tspan x="60" dy="0">Cause of business popularity </tspan></text><text x="60" y="190" font-size="28" fill="#384e52"><tspan x="60" dy="0">The firm's popularity is due to its reliable after-sales service. </tspan></text><rect x="55" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 45l70-42 70 42H10m15 10v65m36-65v65m38-65v65m36-65v65M5 125h150M5 140h150"/></g><text x="80" y="515" font-size="27" fill="#183f3b"><tspan x="80" dy="0">Reliable service </tspan></text><path d="M485 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="555" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(685 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 45l70-42 70 42H10m15 10v65m36-65v65m38-65v65m36-65v65M5 125h150M5 140h150"/></g><text x="580" y="515" font-size="27" fill="#183f3b"><tspan x="580" dy="0">CAUSE → </tspan></text><path d="M985 440h60" stroke="#ca7858" stroke-width="5" marker-end="url(#arrow)"/><rect x="1055" y="300" width="425" height="300" rx="24" fill="#e6efea"/><g transform="translate(1185 330)" fill="none" stroke="#2c5c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 45l70-42 70 42H10m15 10v65m36-65v65m38-65v65m36-65v65M5 125h150M5 140h150"/></g><text x="1080" y="515" font-size="27" fill="#183f3b"><tspan x="1080" dy="0">Popular company </tspan></text><rect x="55" y="635" width="1425" height="325" rx="24" fill="#183f3b"/><text x="85" y="685" font-size="29" fill="#ffffff"><tspan x="85" dy="0">Fixed preposition phrase </tspan></text><text x="85" y="735" font-size="34" fill="#f5c998"><tspan x="85" dy="0">due to + cause </tspan></text><text x="85" y="795" font-size="25" fill="#ffffff"><tspan x="85" dy="0">Due to is the fixed phrase for cause. The other prepositions do not complete it. </tspan></text></g></svg>