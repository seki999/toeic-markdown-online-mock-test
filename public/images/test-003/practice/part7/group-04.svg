<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1450"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ba6749"/></marker></defs><rect width="1536" height="1450" rx="24" fill="#f8f5ec"/><g font-family="Arial, sans-serif"><text x="60" y="55" font-size="22" fill="#193f40"><tspan x="60" dy="0">PART 7 · READING EVIDENCE MAP · GROUP 4</tspan></text><text x="60" y="112" font-size="40" fill="#193f40"><tspan x="60" dy="0">Mill Fen restoration</tspan></text><text x="60" y="158" font-size="24" fill="#193f40"><tspan x="60" dy="0">Read the documents → connect the evidence → explain the answers</tspan></text><rect x="60" y="192" width="1416" height="96" rx="14" fill="#dcebe5"/><path d="M82 211h26l12 12v43h-38zM108 211v14h12" fill="none" stroke="#2c5c57" stroke-width="2"/><text x="138" y="235" font-size="25" fill="#193f40"><tspan x="138" dy="0">D1 · Article</tspan></text><rect x="60" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="90" cy="355" r="16" fill="#2c5c57"/><text x="83" y="362" font-size="20" fill="#fff"><tspan x="83" dy="0">1</tspan></text><text x="83" y="402" font-size="26" fill="#193f40"><tspan x="83" dy="0">Gradual reed removal</tspan></text><path d="M510 397h28" stroke="#ba6749" stroke-width="4" marker-end="url(#arrow)"/><rect x="545" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="575" cy="355" r="16" fill="#2c5c57"/><text x="568" y="362" font-size="20" fill="#fff"><tspan x="568" dy="0">2</tspan></text><text x="568" y="402" font-size="26" fill="#193f40"><tspan x="568" dy="0">Decoy tests bird responses</tspan></text><path d="M995 397h28" stroke="#ba6749" stroke-width="4" marker-end="url(#arrow)"/><rect x="1030" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="1060" cy="355" r="16" fill="#2c5c57"/><text x="1053" y="362" font-size="20" fill="#fff"><tspan x="1053" dy="0">3</tspan></text><text x="1053" y="402" font-size="26" fill="#193f40"><tspan x="1053" dy="0">Compare counts with past</tspan><tspan x="1053" dy="35.1">surveys</tspan></text><text x="60" y="520" font-size="23" fill="#193f40"><tspan x="60" dy="0">ANSWER EVIDENCE · follow each connection back to the original material</tspan></text><rect x="60" y="550" width="1416" height="245" rx="16" fill="#fff" stroke="#bdcfc5"/><rect x="60" y="550" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="598" font-size="28" fill="#fff"><tspan x="76" dy="0">Q156</tspan></text><text x="200" y="590" font-size="29" fill="#193f40"><tspan x="200" dy="0">Avoid soil and garden damage</tspan></text><text x="200" y="643" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer C: Rapid changes could damage the environment</tspan></text><text x="200" y="695" font-size="23" fill="#193f40"><tspan x="200" dy="0">The article identifies soil disturbance and garden damage. Film crews, universal</tspan><tspan x="200" dy="31.05">protection, and completed surveys are not the reason.</tspan></text><rect x="60" y="820" width="1416" height="245" rx="16" fill="#e7eee8" stroke="#bdcfc5"/><rect x="60" y="820" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="868" font-size="28" fill="#fff"><tspan x="76" dy="0">Q157</tspan></text><text x="200" y="860" font-size="29" fill="#193f40"><tspan x="200" dy="0">Decoy is a research tool</tspan></text><text x="200" y="913" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer B: Studying birds' responses</tspan></text><text x="200" y="965" font-size="23" fill="#193f40"><tspan x="200" dy="0">It tests responses to intruders. The other tasks are not the stated purpose.</tspan></text><rect x="60" y="1090" width="1416" height="245" rx="16" fill="#fff" stroke="#bdcfc5"/><rect x="60" y="1090" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="1138" font-size="28" fill="#fff"><tspan x="76" dy="0">Q158</tspan></text><text x="200" y="1130" font-size="29" fill="#193f40"><tspan x="200" dy="0">Bird-count trend measures progress</tspan></text><text x="200" y="1183" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer C: By comparing bird counts over time</tspan></text><text x="200" y="1235" font-size="23" fill="#193f40"><tspan x="200" dy="0">Bird counts are compared with earlier surveys. Donations and guide appeal are not success</tspan><tspan x="200" dy="31.05">measures; photographs alone are insufficient.</tspan></text><text x="60" y="1410" font-size="21" fill="#193f40"><tspan x="60" dy="0">Learning aid with answer clues · conditions and uncertainty remain part of the evidence</tspan></text></g></svg>