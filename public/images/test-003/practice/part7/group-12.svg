97h28" stroke="#ba6749" stroke-width="4" marker-end="url(#arrow)"/><rect x="1030" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="1060" cy="355" r="16" fill="#2c5c57"/><text x="1053" y="362" font-size="20" fill="#fff"><tspan x="1053" dy="0">3</tspan></text><text x="1053" y="402" font-size="26" fill="#193f40"><tspan x="1053" dy="0">D2: 3:30 request; leave</tspan><tspan x="1053" dy="35.1">backdrop</tspan></text><text x="60" y="520" font-size="23" fill="#193f40"><tspan x="60" dy="0">ANSWER EVIDENCE · follow each connection back to the original material</tspan></text><rect x="60" y="550" width="1416" height="245" rx="16" fill="#fff" stroke="#bdcfc5"/><rect x="60" y="550" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="598" font-size="28" fill="#fff"><tspan x="76" dy="0">Q180</tspan></text><text x="200" y="590" font-size="29" fill="#193f40"><tspan x="200" dy="0">Guardian required because of age</tspan></text><text x="200" y="643" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer B: She is under eighteen</tspan></text><text x="200" y="695" font-size="23" fill="#193f40"><tspan x="200" dy="0">She is seventeen and the page requires a guardian for under-eighteens. The other conditions</tspan><tspan x="200" dy="31.05">are not the reason.</tspan></text><rect x="60" y="820" width="1416" height="245" rx="16" fill="#e7eee8" stroke="#bdcfc5"/><rect x="60" y="820" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="868" font-size="28" fill="#fff"><tspan x="76" dy="0">Q181</tspan></text><text x="200" y="860" font-size="29" fill="#193f40"><tspan x="200" dy="0">3:30 fits request and 10–4 window</tspan></text><text x="200" y="913" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer A: 3:30 p.m.</tspan></text><text x="200" y="965" font-size="23" fill="#193f40"><tspan x="200" dy="0">3:30 is the requested time and within the window. Morning/noon conflict with school; five</tspan><tspan x="200" dy="31.05">is outside the window.</tspan></text><rect x="60" y="1090" width="1416" height="245" rx="16" fill="#fff" stroke="#bdcfc5"/><rect x="60" y="1090" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="1138" font-size="28" fill="#fff"><tspan x="76" dy="0">Q182</tspan></text><text x="200" y="1130" font-size="29" fill="#193f40"><tspan x="200" dy="0">Elaborate backdrop stays at home</tspan></text><text x="200" y="1183" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer B: Leaving the backdrop at home</tspan></text><text x="200" y="1235" font-size="23" fill="#193f40"><tspan x="200" dy="0">The message drops the elaborate backdrop in response to prop guidance. The other changes</tspan><tspan x="200" dy="31.05">are not stated.</tspan></text><text x="60" y="1410" font-size="21" fill="#193f40"><tspan x="60" dy="0">Learning aid with answer clues · conditions and uncertainty remain part of the evidence</tspan></text></g></svg>