<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1450"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ba6749"/></marker></defs><rect width="1536" height="1450" rx="24" fill="#f8f5ec"/><g font-family="Arial, sans-serif"><text x="60" y="55" font-size="22" fill="#193f40"><tspan x="60" dy="0">PART 7 · READING EVIDENCE MAP · GROUP 7</tspan></text><text x="60" y="112" font-size="40" fill="#193f40"><tspan x="60" dy="0">Lumen Street Festival</tspan></text><text x="60" y="158" font-size="24" fill="#193f40"><tspan x="60" dy="0">Read the documents → connect the evidence → explain the answers</tspan></text><rect x="60" y="192" width="696" height="96" rx="14" fill="#dcebe5"/><path d="M82 211h26l12 12v43h-38zM108 211v14h12" fill="none" stroke="#2c5c57" stroke-width="2"/><text x="138" y="235" font-size="25" fill="#193f40"><tspan x="138" dy="0">D1 · Advertisement</tspan></text><rect x="780" y="192" width="696" height="96" rx="14" fill="#dcebe5"/><path d="M802 211h26l12 12v43h-38zM828 211v14h12" fill="none" stroke="#2c5c57" stroke-width="2"/><text x="858" y="235" font-size="25" fill="#193f40"><tspan x="858" dy="0">D2 · Email</tspan></text><rect x="60" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="90" cy="355" r="16" fill="#2c5c57"/><text x="83" y="362" font-size="20" fill="#fff"><tspan x="83" dy="0">1</tspan></text><text x="83" y="402" font-size="26" fill="#193f40"><tspan x="83" dy="0">D1: workshop $25; courtyard</tspan><tspan x="83" dy="35.1">#18</tspan></text><path d="M510 397h28" stroke="#ba6749" stroke-width="4" marker-end="url(#arrow)"/><rect x="545" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="575" cy="355" r="16" fill="#2c5c57"/><text x="568" y="362" font-size="20" fill="#fff"><tspan x="568" dy="0">2</tspan></text><text x="568" y="402" font-size="26" fill="#193f40"><tspan x="568" dy="0">D2: two places minus one</tspan><tspan x="568" dy="35.1">canceled</tspan></text><path d="M995 397h28" stroke="#ba6749" stroke-width="4" marker-end="url(#arrow)"/><rect x="1030" y="325" width="446" height="145" rx="16" fill="#fff" stroke="#acc6bc"/><circle cx="1060" cy="355" r="16" fill="#2c5c57"/><text x="1053" y="362" font-size="20" fill="#fff"><tspan x="1053" dy="0">3</tspan></text><text x="1053" y="402" font-size="26" fill="#193f40"><tspan x="1053" dy="0">D1 + D2: ballet friend</tspan><tspan x="1053" dy="35.1">attends 5 p.m.</tspan></text><text x="60" y="520" font-size="23" fill="#193f40"><tspan x="60" dy="0">ANSWER EVIDENCE · follow each connection back to the original material</tspan></text><rect x="60" y="550" width="1416" height="245" rx="16" fill="#fff" stroke="#bdcfc5"/><rect x="60" y="550" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="598" font-size="28" fill="#fff"><tspan x="76" dy="0">Q165</tspan></text><text x="200" y="590" font-size="29" fill="#193f40"><tspan x="200" dy="0">Retains one paid workshop seat</tspan></text><text x="200" y="643" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer B: One</tspan></text><text x="200" y="695" font-size="23" fill="#193f40"><tspan x="200" dy="0">He cancels one of two places and keeps his own. His ballet friend needs no workshop seat.</tspan></text><rect x="60" y="820" width="1416" height="245" rx="16" fill="#e7eee8" stroke="#bdcfc5"/><rect x="60" y="820" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="868" font-size="28" fill="#fff"><tspan x="76" dy="0">Q166</tspan></text><text x="200" y="860" font-size="29" fill="#193f40"><tspan x="200" dy="0">Ballet at 5; concert at 7</tspan></text><text x="200" y="913" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer A: 5 p.m.</tspan></text><text x="200" y="965" font-size="23" fill="#193f40"><tspan x="200" dy="0">She prefers ballet, which the advertisement schedules at five. The other times concern</tspan><tspan x="200" dy="31.05">collection, desk opening, and the concert.</tspan></text><rect x="60" y="1090" width="1416" height="245" rx="16" fill="#fff" stroke="#bdcfc5"/><rect x="60" y="1090" width="110" height="245" rx="16" fill="#214b49"/><text x="76" y="1138" font-size="28" fill="#fff"><tspan x="76" dy="0">Q167</tspan></text><text x="200" y="1130" font-size="29" fill="#193f40"><tspan x="200" dy="0">Instruction behind number 18</tspan></text><text x="200" y="1183" font-size="24" fill="#193f40"><tspan x="200" dy="0">Answer B: Behind number 18</tspan></text><text x="200" y="1235" font-size="23" fill="#193f40"><tspan x="200" dy="0">The photography workshop uses that courtyard. Pass collection and performance venues do not</tspan><tspan x="200" dy="31.05">change the instruction location.</tspan></text><text x="60" y="1410" font-size="21" fill="#193f40"><tspan x="60" dy="0">Learning aid with answer clues · conditions and uncertainty remain part of the evidence</tspan></text></g></svg>